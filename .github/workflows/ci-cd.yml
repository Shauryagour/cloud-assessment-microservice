name: Microservice CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite (Blocks deployment if failing)
        run: |
          pytest -v tests/

  build-and-deploy:
    name: Build Docker Image & Deploy to AWS ECR / EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build Local Docker Image (Verification)
        run: |
          docker build -t cloud-microservice:latest .
          docker images cloud-microservice:latest

      - name: Evaluate AWS Cloud Credentials
        id: evaluate_aws
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "aws_ready=true" >> "$GITHUB_OUTPUT"
            echo "AWS credentials detected."
          else
            echo "aws_ready=false" >> "$GITHUB_OUTPUT"
            echo "No AWS credentials detected in GitHub Secrets."
            echo "Docker build completed successfully. Automated AWS push skipped until secrets are configured."
          fi
          if [ -n "$EC2_HOST" ] && [ -n "$EC2_SSH_KEY" ]; then
            echo "ec2_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ec2_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS Credentials
        if: steps.evaluate_aws.outputs.aws_ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        if: steps.evaluate_aws.outputs.aws_ready == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        if: steps.evaluate_aws.outputs.aws_ready == 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY || 'cloud-microservice' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag cloud-microservice:latest "$REGISTRY/$REPO:$IMAGE_TAG"
          docker tag cloud-microservice:latest "$REGISTRY/$REPO:latest"
          docker push "$REGISTRY/$REPO:$IMAGE_TAG"
          docker push "$REGISTRY/$REPO:latest"
          echo "Successfully pushed $REGISTRY/$REPO to AWS ECR"

      - name: Deploy to EC2 via SSH
        if: steps.evaluate_aws.outputs.aws_ready == 'true' && steps.evaluate_aws.outputs.ec2_ready == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION || 'us-east-1' }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY || 'cloud-microservice' }}:latest
            docker stop aws_cloud_microservice || true
            docker rm aws_cloud_microservice || true
            docker run -d --name aws_cloud_microservice -p 80:8000 --restart unless-stopped ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY || 'cloud-microservice' }}:latest
            docker ps
